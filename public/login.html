<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sign in · Viralyst Instagram Audit</title>
  <meta name="theme-color" content="#D9482A">
  <meta name="robots" content="noindex">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/style.css">
</head>
<body class="login-page">
  <main class="login-wrap">
    <img class="login-mark" src="/favicon.svg" alt="" width="64" height="64">
    <h1>Viralyst Instagram Audit</h1>
    <p class="note">Enter the team password to continue.</p>
    <form id="login-form" class="card login-card" novalidate>
      <label class="field">
        <span>Password</span>
        <input id="password" type="password" autocomplete="current-password" required>
      </label>
      <p id="login-error" class="error" role="alert" hidden></p>
      <button id="login-button" class="pill primary" type="submit">Sign in</button>
    </form>
  </main>
  <script type="module" src="/login.js"></script>
</body>
</html>
